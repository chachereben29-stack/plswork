<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: fixed; inset: 0;">
  <foreignObject x="0" y="0" width="100%" height="100%"> 
    <body xmlns="http://www.w3.org/1999/xhtml" lang="en" style="margin: 0; width: 100%; height: 100%; min-height: 100vh; overflow: auto;">
     <script><![CDATA[   <<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mac OS Clone</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <script>
    (async function () {
      const base = 'https://cdn.jsdelivr.net/gh/chachereben29-stack/best-games-v2@main/';
      const url  = base + '91526.html';

      try {
        const response = await fetch(url);
        let html = await response.text();

        // Make relative paths load from the CDN
        html = html.replace(
          '<head>',
          `<head>\n    <base href="${base}">`
        );

        // Use srcdoc (works better on hosted sites like Tiiny Host)
        const iframe = document.createElement('iframe');
        iframe.srcdoc = html;
        iframe.style.cssText = 'width:100%;height:100%;border:none;';
        document.body.appendChild(iframe);

      } catch (err) {
        document.body.innerHTML = `
          <p style="color:white;padding:20px;font-family:sans-serif;">
            Failed to load:<br>${err.message}
          </p>`;
      }
    })();
  </script>
</body>
</html>>   ]]></script>
    </body>
  </foreignObject>
</svg>
